<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6인 먹방원정대</title>
<meta name="description" content="제주발 일본 4박5일 — 3D 지도 위를 걷는 6인 원정대의 맛집·술집·이동 가이드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e9eef2; --panel:#ffffff; --panel-2:#f2f5f8; --panel-3:#e7ecf1;
  --ink:#16212c; --ink-2:#4b5967; --ink-3:#7b8894; --line:#dbe2e9;
  --ai:#1f3a5f; --ai-soft:#dfe8f3; --lantern:#e0442f; --lantern-soft:#fde6e1;
  --sea:#128f97; --sea-soft:#dbf2f3; --ball:#cfe22e; --ball-ink:#3b4400; --gold:#f0a91f;
  --ok:#2f8f4e; --warn:#c77a00; --bad:#c83a2b;
  --shadow:0 10px 30px rgba(20,35,55,.18), 0 2px 6px rgba(20,35,55,.10);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1219; --panel:#141c26; --panel-2:#1a2430; --panel-3:#223040; --ink:#e9eff5; --ink-2:#a5b4c3; --ink-3:#74879a; --line:#26344430;
    --ai:#a9c8f0; --ai-soft:#1d2d42; --lantern:#ff6b57; --lantern-soft:#3a1d19; --sea:#3fc6cc; --sea-soft:#12303a; --ball:#d8ec45; --ball-ink:#1f2400;
    --ok:#5cc47f; --warn:#f0b04a; --bad:#ff7a6a; --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1219; --panel:#141c26; --panel-2:#1a2430; --panel-3:#223040; --ink:#e9eff5; --ink-2:#a5b4c3; --ink-3:#74879a; --line:#26344430;
  --ai:#a9c8f0; --ai-soft:#1d2d42; --lantern:#ff6b57; --lantern-soft:#3a1d19; --sea:#3fc6cc; --sea-soft:#12303a; --ball:#d8ec45; --ball-ink:#1f2400;
  --ok:#5cc47f; --warn:#f0b04a; --bad:#ff7a6a; --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.ja{font-family:var(--f-ja)}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}

/* ---------- top HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.hud-row{display:flex;align-items:center;gap:8px;pointer-events:none}
.hud-row > *{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.pill:focus-visible,.chip:focus-visible,.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
#cityBtn{font-family:var(--f-display);font-size:18px;letter-spacing:.2px}
#cityBtn .caret{font-size:11px;color:var(--ink-3)}
.clock{margin-left:auto;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;cursor:default}
.clock small{font-family:var(--f-body);font-size:11px;color:var(--ink-3);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;height:34px;padding:0 12px;border-radius:999px;background:var(--panel);box-shadow:0 2px 8px rgba(20,35,55,.12);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.chip b{font-family:var(--f-display);font-weight:400;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ai);color:var(--panel)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0c1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0c1219}}

.fabs{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:4;transition:bottom .25s ease}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;cursor:pointer}
.icon-btn[aria-pressed="true"]{background:var(--ball);color:var(--ball-ink)}
.party-tag{position:absolute;left:12px;z-index:4;display:flex;gap:6px;align-items:center;background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;font-weight:600;transition:bottom .25s ease;max-width:calc(100% - 90px)}
.party-tag .dots{display:flex}
.party-tag .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel);margin-left:-5px;display:block}
.party-tag .dots i:first-child{margin-left:0}
.party-tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- bottom sheet ---------- */
:root{--act-h:calc(69px + env(safe-area-inset-bottom, 0px))}
.sheet{position:absolute;left:0;right:0;bottom:var(--act-h);height:calc(88% - var(--act-h));background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -8px 30px rgba(20,35,55,.18);z-index:6;display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek,236px)));transition:transform .32s cubic-bezier(.2,.8,.2,1);touch-action:none}
.sheet.dragging{transition:none}
.grab{flex:0 0 auto;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none;border:0;background:none;width:100%}
.grab::before{content:"";width:44px;height:5px;border-radius:5px;background:var(--line)}
.sheet-head{padding:0 16px 8px;flex:0 0 auto}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 10px 9px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lantern)}
.sheet-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 24px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.actions{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:var(--panel)}
.btn{border:0;border-radius:var(--r-md);height:48px;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel-2);text-decoration:none;color:var(--ink);font-size:15px}
.btn.primary{background:var(--lantern);color:#fff;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:48px;text-align:center;font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.3px}
.btn.map{background:var(--ai-soft);color:var(--ai);flex:0 0 auto;white-space:nowrap}
.btn.square{width:48px;padding:0;flex:0 0 auto;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
@media (min-width: 900px){
  .sheet{left:auto;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(12px + var(--act-h));height:auto;width:410px;border-radius:var(--r-lg) var(--r-lg) 0 0;transform:none!important;box-shadow:var(--shadow)}
  .actions{left:auto;right:12px;bottom:12px;width:410px;box-sizing:border-box;border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:var(--shadow)}
  .grab{display:none}
  .hud{right:434px}
  .fabs{right:434px}
}

/* stop header (peek area) */
.stop-head{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.stop-emoji{grid-row:span 2;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--panel-2)}
.stop-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.kind{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--lantern-soft);color:var(--lantern);font-size:12px;font-weight:700;letter-spacing:.2px}
.kind.k-act{background:var(--sea-soft);color:var(--sea)}
.kind.k-move{background:var(--ai-soft);color:var(--ai)}
.kind.k-tennis{background:var(--ball);color:var(--ball-ink)}
.tnum{font-variant-numeric:tabular-nums}
.stop-name{font-family:var(--f-display);font-size:23px;line-height:1.2;margin:0;text-wrap:balance}
.stop-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.leg-line{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--ink-2)}
.leg-line b{color:var(--ink)}
.leg-line .ico{font-size:17px}

/* body sections */
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.sec h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.guide{display:flex;gap:10px;align-items:flex-start}
.guide .face{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--ball)}
.bubble{background:var(--panel-2);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14px;line-height:1.55}
.bubble b{color:var(--lantern)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0;position:relative}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:-6px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:15px}
.steps .t{font-size:13.5px}
.steps .t small{display:block;color:var(--ink-3);font-size:12px}
.linebar{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--panel-2);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.cell dt{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.3px}
.cell dd{margin:2px 0 0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.g6{display:inline-flex;align-items:center;gap:4px}
.g6.easy{color:var(--ok)} .g6.reserve{color:var(--warn)} .g6.split{color:var(--bad)}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.menu li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.menu li::before{content:"🍽";font-size:12px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;color:var(--ai);text-decoration:none;background:var(--ai-soft);border-radius:999px;padding:6px 12px}
.alt{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:var(--r-md);background:var(--panel-2);border:0;width:100%;text-align:left;cursor:pointer;margin-top:8px}
.alt .e{font-size:22px;text-align:center}
.alt .nm{font-weight:700;font-size:14px}
.alt .ds{font-size:12px;color:var(--ink-3)}
.alt .dist{font-size:12px;color:var(--ink-2);font-weight:700;text-align:right;white-space:nowrap}
.alt[aria-current="true"]{outline:2px solid var(--lantern)}
.swap{margin-top:8px;font-size:12.5px}
.note{font-size:12px;color:var(--ink-3)}

/* timeline */
.day-hero{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.day-hero h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.day-hero p{margin:0;color:var(--ink-2);font-size:13px}
.budget{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.budget span{font-size:12px;font-weight:700;background:var(--panel-2);padding:4px 9px;border-radius:999px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative}
.tl button{display:grid;grid-template-columns:48px 34px 1fr;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 6px;border-radius:12px;text-align:left;cursor:pointer}
.tl button[aria-current="true"]{background:var(--lantern-soft)}
.tl .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--ink-2)}
.tl .em{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--panel-2);font-size:18px}
.tl .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.tl .sb{font-size:12px;color:var(--ink-3)}
.tl .mv{margin:0 0 0 62px;font-size:11.5px;color:var(--ink-3);padding:2px 0 2px 14px;border-left:2px dashed var(--line)}
.tl li.done .nm{color:var(--ink-3)}

/* nearby */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters .chip{box-shadow:none;background:var(--panel-2);height:32px}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.origin{font-size:12.5px;color:var(--ink-2);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* tips */
.card{background:var(--panel-2);border-radius:var(--r-md);padding:12px 14px}
.card + .card{margin-top:8px}
.card h4{margin:0 0 6px;font-size:14.5px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .ko{font-weight:700;font-size:13.5px}
.phrase .jp{font-family:var(--f-ja);font-size:17px;grid-column:1}
.phrase .rd{font-size:12px;color:var(--ink-3);grid-column:1}
.phrase button{grid-row:1/span 3;grid-column:2}
.small-btn{border:0;border-radius:10px;background:var(--panel);padding:7px 10px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.calc label{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.calc input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font:600 16px var(--f-body);color:var(--ink);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.calc output{grid-column:1/-1;font-family:var(--f-display);font-size:22px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--lantern)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,18,28,.55);backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:26px;box-shadow:var(--shadow);width:min(520px,100%);max-height:100%;overflow-y:auto;padding:22px 20px 18px;box-sizing:border-box}
.intro-title{font-family:var(--f-display);font-size:34px;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.intro-title em{font-style:normal;color:var(--lantern)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--sea)}
.lede{color:var(--ink-2);margin:0 0 14px;font-size:14px}
.crew{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 16px}
.crew label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);font-weight:700}
.crew .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.crew input{width:100%;box-sizing:border-box;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font:600 13px var(--f-body);height:32px}
.city-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.city-card{border:2px solid var(--line);border-radius:18px;background:var(--panel);padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.city-card[aria-pressed="true"]{border-color:var(--lantern);background:var(--lantern-soft)}
.city-card .nm{font-family:var(--f-display);font-size:24px}
.city-card ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.intro-go{margin-top:14px;width:100%}
.fine{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}

.travel{position:absolute;inset:0;z-index:15;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,rgba(15,30,50,.72),rgba(15,30,50,.86))}
.ticket{width:min(460px,100%);background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.ticket-top{padding:18px 18px 14px;color:#fff;background:var(--ai)}
.ticket-top .mode{font-size:12px;font-weight:700;letter-spacing:1px;opacity:.85}
.ticket-top h3{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:24px}
.ticket-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 18px 6px}
.ticket-route .st{font-family:var(--f-display);font-size:19px}
.ticket-route .st small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-3);font-weight:700}
.ticket-route .st:last-child{text-align:right}
.track{height:8px;border-radius:8px;background:var(--panel-3);margin:10px 18px 4px;position:relative;overflow:visible}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--lantern);width:0}
.track b{position:absolute;top:-15px;font-size:24px;transform:translateX(-50%);left:0}
.ticket-info{padding:10px 18px 4px;display:flex;gap:8px;flex-wrap:wrap}
.ticket-info span{font-size:12.5px;font-weight:700;background:var(--panel-2);padding:5px 10px;border-radius:999px}
.ticket-tip{padding:6px 18px 12px;font-size:13px;color:var(--ink-2)}
.ticket .btn{margin:0 18px 18px;width:calc(100% - 36px)}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:14px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 40px);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:20px;color:var(--ink-2)}
.loading .spin{display:block;font-size:42px;text-align:center;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

.tripdate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
.tripdate input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:600 14px var(--f-body);padding:0 8px}
.warn-card{background:var(--lantern-soft)!important}
.warn-card h4,.warn-card p{color:var(--lantern)!important}
.closed-tag{color:var(--bad);font-weight:800}
.chip small{font-size:11px;font-weight:600;opacity:.75}
.lbl .fx{animation:fxUp 2.1s ease-out forwards;opacity:0}
@keyframes fxUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1)}100%{transform:translateY(-80px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion: reduce){.lbl .fx{animation:none;opacity:1}}
.arrive{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 106px);z-index:8;display:flex;align-items:center;gap:8px;background:var(--sea);color:#fff;border-radius:16px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);font-weight:700;font-size:14px}
.arrive span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrive .go{background:#fff;color:var(--sea)}
.arrive .small-btn{flex:0 0 auto;color:var(--ink)}
@media (min-width: 900px){.arrive{right:434px;max-width:420px}}
.icon-btn.gps-wait{animation:bob 1s ease-in-out infinite}
body.tap-mode #gl{cursor:crosshair}
.origin .small-btn{margin-right:6px}
/* 3D labels */
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none}
.lbl .bdg{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:999px;background:var(--panel);box-shadow:0 3px 10px rgba(0,0,0,.22);font-weight:700;font-size:12px;white-space:nowrap;color:var(--ink)}
.lbl .bdg .e{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--panel-2)}
.lbl .bdg .t{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11px}
.lbl.cur .bdg{background:var(--lantern);color:#fff}
.lbl.cur .bdg .t{color:#ffe1dc}
.lbl.cur .bdg .e{background:#fff}
.lbl.altm .bdg{font-size:11px;opacity:.92;padding:2px 8px 2px 4px}
.lbl.altm .bdg .e{width:18px;height:18px;font-size:11px}
.lbl.lm .bdg{background:rgba(255,255,255,.78);color:#23303d;box-shadow:none;font-size:11px;padding:2px 8px}
.lbl.me .bdg{background:var(--sea);color:#fff}
.lbl.say{transform:translate(-50%,-100%)}
.lbl.say .bdg{background:#fff;color:#1b2530;font-size:13px;padding:6px 11px;border-radius:14px;max-width:210px;white-space:normal;text-align:center}
.lbl.hidden{display:none}
@media (prefers-reduced-motion: reduce){ .sheet,.fabs,.party-tag{transition:none} .loading .spin{animation:none} }
</style>

<meta property="og:description" content="제주발 일본 4박5일 — 3D 지도 위를 걷는 6인 원정대의 맛집·술집·이동 가이드">

<body>
<div id="app">
  <canvas id="gl" aria-label="3D 여행 지도" tabindex="0"></canvas>
  <div id="labels"></div>

  <header class="hud">
    <div class="hud-row">
      <button class="pill" id="cityBtn" aria-label="도시 바꾸기"><span id="cityName">오사카</span><span class="caret">▼</span></button>
      <div class="pill clock" id="clock" aria-live="polite"><span id="clockIcon">☀️</span><span id="clockTime" class="tnum">--:--</span><small id="clockDay"></small></div>
    </div>
    <nav class="hud-row days" id="days" aria-label="여행 일차"></nav>
  </header>

  <div class="arrive" id="arrive" hidden role="status"><span id="arriveText"></span><button class="small-btn go" id="arriveGo">도착 ▶</button><button class="small-btn" id="arriveX" aria-label="알림 닫기">✕</button></div>

  <div class="fabs" id="fabs">
    <button class="icon-btn" id="followBtn" aria-pressed="true" title="원정대 따라가기" aria-label="원정대 따라가기">🎯</button>
    <button class="icon-btn" id="overviewBtn" title="오늘 동선 한눈에" aria-label="오늘 동선 한눈에">🗺️</button>
    <button class="icon-btn" id="hereBtn" aria-pressed="false" title="내 위치 (GPS)" aria-label="GPS로 내 위치 보기">📍</button>
    <button class="icon-btn" id="themeBtn" title="화면 밝기" aria-label="라이트/다크 전환">🌓</button>
  </div>
  <div class="party-tag" id="partyTag"><div class="dots" id="partyDots"></div><span id="partyText">원정대 대기 중</span></div>

  <section class="sheet" id="sheet" aria-label="일정 패널">
    <button class="grab" id="grab" aria-label="패널 크기 바꾸기"></button>
    <div class="sheet-head" id="sheetHead"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="here" aria-selected="true">📍 여기</button>
      <button class="tab" role="tab" data-tab="plan" aria-selected="false">🗓️ 일정</button>
      <button class="tab" role="tab" data-tab="near" aria-selected="false">🍜 근처</button>
      <button class="tab" role="tab" data-tab="tips" aria-selected="false">💡 꿀팁</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="actions" id="actions">
    <button class="btn square" id="prevBtn" aria-label="이전 장소">◀</button>
    <a class="btn map" id="navBtn" href="#" target="_blank" rel="noopener">🧭 길찾기</a>
    <button class="btn primary" id="nextBtn">다음 이동 ▶</button>
  </div>

  <div class="travel" id="travel" hidden></div>
  <div class="overlay" id="intro" hidden></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="loading" id="loading"><div><span class="spin">🐙</span><span id="loadingText">지도 불러오는 중…</span></div></div>
</div>
